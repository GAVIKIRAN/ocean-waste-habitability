services:
  app:
    build: .
    ports: ["8501:8501"]
    volumes:
      - ./models:/app/models
      - ./reports:/app/reports
      - ./data:/app/data
  app-gpu:
    profiles: ["gpu"]
    build:
      context: .
      args:
        TORCH_INDEX: https://download.pytorch.org/whl/cu128
    ports: ["8502:8501"]
    volumes:
      - ./models:/app/models
      - ./reports:/app/reports
      - ./data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
